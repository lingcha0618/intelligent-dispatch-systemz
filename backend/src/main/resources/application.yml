server:
  port: 8080

spring:
  application:
    name: campus-dispatch
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    banner: false
    db-config:

      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.campus.dispatch.modules.*.entity

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-set-JWT_SECRET-env-var-in-production}
  expire: 86400

knife4j:
  enable: true
  setting:
    language: zh_cn